    <title>Pacha · Cocina de Autor en Cafayate, Salta</title>
    <!--
      Datos del restaurante para búsqueda local. Van acá, estáticos, para que los
      lean también los rastreadores que no ejecutan JavaScript. Si cambian los
      horarios o el teléfono en la página, actualizar también este bloque.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Pacha Cocina de Autor",
        "description": "Cocina de autor étnica de recolección del chef Tomás Casado en Cafayate, Salta.",
        "servesCuisine": ["Cocina de autor", "Cocina argentina", "Cocina del norte argentino"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Gral. Güemes Sur 143",
          "addressLocality": "Cafayate",
          "addressRegion": "Salta",
          "addressCountry": "AR"
        },
        "telephone": "+543868412206",
        "email": "pachacocinadeautor@gmail.com",
        "acceptsReservations": "https://pacha.meitre.com/",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "19:00",
            "closes": "23:30"
          }
        ],
        "sameAs": [
          "https://www.instagram.com/pachacafayate",
          "https://www.facebook.com/pachacafayate/"
        ]
      }
    </script>
  </head>
